<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';" />
		<title>Promptly Chat</title>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="chat-container">
			<div class="chat-header">
				<div class="chat-header-left">
					<span class="chat-brand">Promptly</span>
					<div class="provider-select-wrapper">
						<span class="chat-provider-name" id="providerName">API</span>
						<svg
							class="select-arrow"
							width="12"
							height="12"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<polyline points="6 9 12 15 18 9"></polyline>
						</svg>
						<div class="provider-dropdown" id="providerDropdown"></div>
					</div>
				</div>
				<div class="chat-header-right">
					<button class="header-btn" id="clearChatBtn" title="Clear chat" style="display: none;">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path d="M3 6h18"></path>
							<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
							<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
						</svg>
					</button>
					<button class="header-btn" id="maximizeBtn" title="Maximize">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
						</svg>
					</button>
					<button class="header-btn" id="closeBtn" title="Minimize">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<line x1="5" y1="12" x2="19" y2="12"></line>
						</svg>
					</button>
				</div>
			</div>

			<div class="chat-messages" id="chatMessages">
				<div class="chat-empty-state">
					<div class="empty-icon">
						<svg
							width="48"
							height="48"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round">
							<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
						</svg>
					</div>
					<p class="empty-title">Start a conversation</p>
					<p class="empty-subtitle">Type your message below to chat with the API</p>
				</div>
			</div>

			<div class="chat-input-area">
				<div class="chat-input-wrapper">
					<textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1" dir="auto"></textarea>
					<button class="send-btn" id="sendBtn" disabled>
						<svg
							width="18"
							height="18"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round">
							<line x1="22" y1="2" x2="11" y2="13"></line>
							<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
						</svg>
					</button>
				</div>
				<div class="input-hint">
					<span>Press <kbd>Enter</kbd> to send, <kbd>Shift+Enter</kbd> for new line</span>
				</div>
			</div>
		</div>

		<script src="./app.js"></script>
	</body>
</html>
